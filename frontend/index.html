<!doctype html>
<html lang="hi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OpenRTI — India's Open RTI Database</title>
    <meta
      name="description"
      content="OpenRTI — India's open RTI database. Search, upload and share Right to Information documents in Hindi and English."
    />
    <!-- Devanagari + UI fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@400;500;600&family=DM+Mono:wght@400;500&family=Instrument+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap"
      rel="stylesheet"
    />
    <style>
      /* Critical: Devanagari words must not break mid-glyph */
      .hindi-text {
        font-family: "Noto Sans Devanagari", sans-serif;
        word-break: keep-all;
        overflow-wrap: break-word;
      }
      .ui-text {
        font-family: "Instrument Sans", sans-serif;
      }
      * {
        font-family: "Instrument Sans", "Noto Sans Devanagari", sans-serif;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>

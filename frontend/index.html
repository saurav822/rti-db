<!doctype html>
<html lang="hi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RTI Commons — सूचना का अधिकार ज्ञानकोश</title>
    <meta
      name="description"
      content="India's open RTI knowledge base — search, upload and share Right to Information documents in Hindi and English."
    />
    <!-- Devanagari + UI fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      /* Critical: Devanagari words must not break mid-glyph */
      .hindi-text {
        font-family: "Noto Sans Devanagari", sans-serif;
        word-break: keep-all;
        overflow-wrap: break-word;
      }
      .ui-text {
        font-family: "IBM Plex Sans", sans-serif;
      }
      * {
        font-family: "IBM Plex Sans", "Noto Sans Devanagari", sans-serif;
      }
    </style>
  </head>
  <body class="bg-gray-50">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>OpenRTI Form Filler</title>
  <style>
    body { font-family: system-ui, sans-serif; width: 340px; margin: 12px; color: #1a1a1a; }
    h1 { font-size: 15px; margin: 0 0 8px; }
    p { font-size: 13px; line-height: 1.4; margin: 6px 0; }
    button { font-size: 13px; padding: 8px 12px; cursor: pointer; width: 100%; }
    #report { font-size: 12px; margin-top: 10px; }
    .ok { color: #138808; }
    .warn { color: #b45309; }
    .bad { color: #b91c1c; }
    .note { color: #555; font-size: 12px; }
  </style>
</head>
<body>
  <h1>OpenRTI form filler</h1>
  <p>1. On openrti (our site), click <b>Copy form data</b>.</p>
  <p>2. Open the RTI Online form on rtionline.gov.in.</p>
  <p>3. Click the button below.</p>
  <button id="fill">Fill the form</button>
  <p class="note">You still type the CAPTCHA, OTP, email and mobile number, attach the PDF, pay, and press submit.</p>
  <div id="report"></div>
  <script src="popup.js"></script>
</body>
</html>
